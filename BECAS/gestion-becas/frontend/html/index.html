<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ScholarLink - Inicio de Sesión</title>

    <link rel="stylesheet" href="../css/estilos.css">
</head>

<body>

    <div class="login-container">

        <div class="login-card">

            <!-- Logo de ScholarLink -->
            <div class="logo">
                <img
                    src="../img/logo-scholarlink.png"
                    alt="Logo de ScholarLink"
                >
            </div>

            <h1>ScholarLink</h1>

            <p class="subtitle">
                Conecta con la beca que transforma tu futuro
            </p>

            <form id="loginForm">

                <div class="form-group">
                    <label for="usuario">Usuario</label>

                    <input
                        type="text"
                        id="usuario"
                        placeholder="Ingrese su usuario"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Ingrese su contraseña"
                        required
                    >
                </div>

                <button type="submit" class="btn-primary">
                    Iniciar sesión
                </button>

            </form>

            <div id="mensaje"></div>

        </div>

    </div>

    <script src="../js/login.js"></script>

</body>
</html>
